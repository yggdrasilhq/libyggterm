[workspace]
members = ["crates/emd-renderer", "crates/yggui", "crates/yggui-contract", "crates/yggui-icons", "crates/emd-page-host"]
resolver = "2"

[workspace.package]
# Kept in step with the release tag. It had drifted (0.1.0 while the tree was
# tagged v0.2.0) because nothing consumes the number — yggterm pins by TAG —
# and a version that nobody reads is a version that lies.
version = "0.14.4"
edition = "2024"
authors = ["Yggdrasil HQ"]
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
sha2 = "0.10"
